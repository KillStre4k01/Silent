name: Paper Private SMP

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Paper 1.21.11
        shell: bash
        run: |
          set -e

          USER_AGENT="PrivateSMP/1.0 (GitHub Actions)"

          curl -fL \
            -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds" \
            -o builds.json

          URL=$(python -c "import json; d=json.load(open('builds.json')); print(next(x['downloads']['server:default']['url'] for x in d if x['channel']=='STABLE'))")

          curl -fL \
            -H "User-Agent: $USER_AGENT" \
            "$URL" \
            -o paper.jar

      - name: Configure Server
        run: |
          echo "eula=true" > eula.txt

          cat > server.properties <<'EOF'
          motd=Private Survival SMP
          gamemode=survival
          difficulty=normal
          hardcore=false
          pvp=true
          online-mode=true
          white-list=true
          enforce-whitelist=true
          max-players=10
          view-distance=8
          simulation-distance=6
          allow-flight=false
          server-port=25565
          server-ip=
          level-name=world
          generate-structures=true
          EOF

      - name: Start Paper Server
        run: |
          java -Xms1G -Xmx4G -jar paper.jar --nogui
      - name: Silent SMP
             run: |
               echo "Public IP:"
               curl -4 https://ifconfig.me
