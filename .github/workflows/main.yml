name: Paper Private SMP

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Paper 1.21.11
        shell: bash
        run: |
          set -e
          VERSION="1.21.11"
          BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/paper/versions/${VERSION}" | python -c "import sys,json; print(json.load(sys.stdin)['builds'][-1])")
          curl -fL -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/${VERSION}/builds/${BUILD}/downloads/paper-${VERSION}-${BUILD}.jar"

      - name: Prepare server files
        shell: bash
        run: |
          test -f server.properties || cp server.properties.example server.properties
          echo "eula=true" > eula.txt
          mkdir -p world world_nether world_the_end

      - name: Start Paper
        shell: bash
        run: |
          java -Xms1G -Xmx4G -jar paper.jar --nogui
